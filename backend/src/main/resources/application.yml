server:
  port: ${PORT:8080}

spring:
  application:
    name: life-rpg-backend
  datasource:
    url: ${DB_URL:${DATABASE_URL:jdbc:h2:file:./data/liferpgdb;DB_CLOSE_DELAY=-1;MODE=MySQL}}
    username: ${DB_USERNAME:${DATABASE_USERNAME:sa}}
    password: ${DB_PASSWORD:${DATABASE_PASSWORD:}}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

jwt:
  secret: ${JWT_SECRET}
  expirationMs: ${JWT_EXPIRATION_MS:86400000}

app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173,https://life-rpg-gamification.netlify.app}

ai:
  api-key: ${AI_API_KEY:}
